<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise RAG & Document Intelligence Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-3xl w-full bg-slate-900 border border-slate-800 rounded-xl p-8 shadow-2xl">
        <header class="mb-8 border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-bold text-cyan-400">Enterprise RAG Engine</h1>
            <p class="text-sm text-slate-400 mt-1">Python, LangChain, FAISS, FastAPI, Hugging Face Cross-Encoders</p>
        </header>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Test Semantic Search Query</label>
                <div class="flex gap-2">
                    <input type="text" id="queryInput" value="How does cross-encoder reranking prevent hallucinations?" class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-slate-100 focus:outline-none focus:border-cyan-500">
                    <button onclick="runQuery()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-medium px-6 py-2 rounded-lg transition-colors">Run Query</button>
                </div>
            </div>

            <div id="resultsArea" class="mt-6 hidden bg-slate-950 border border-slate-800 rounded-lg p-6 space-y-4">
                <div>
                    <h3 class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Synthesized Answer</h3>
                    <p id="answerText" class="text-slate-200 mt-1"></p>
                </div>
                <div class="flex justify-between text-xs text-slate-400 border-t border-slate-800 pt-4">
                    <span>Inference Latency: <strong id="latencyText" class="text-cyan-400"></strong></span>
                    <span>Citation Verification: <strong class="text-emerald-400">Validated</strong></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function runQuery() {
            const query = document.getElementById('queryInput').value;
            const resultsArea = document.getElementById('resultsArea');
            const answerText = document.getElementById('answerText');
            const latencyText = document.getElementById('latencyText');

            try {
                const response = await fetch('https://enterprise-rag-engine-1.onrender.com/api/v1/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });
                const data = await response.json();
                answerText.textContent = data.answer;
                latencyText.textContent = data.latency_ms + ' ms';
                resultsArea.classList.remove('hidden');
            } catch (err) {
                alert('Make sure your FastAPI backend is running locally on port 8000!');
            }
        }
    </script>
</body>
</html>
